name: Build Îlot14 Hollow Ashes
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - uses: actions/checkout@v4

      # The zip is flat (no folders), so arrange the files first.
      - name: Arrange flat files
        run: |
          mkdir -p src dlc
          mv main.cpp src/ 2>/dev/null || true
          mv zones_base.h src/ 2>/dev/null || true
          mv *.dlc dlc/ 2>/dev/null || true

      - name: Install libraries
        run: |
          PM=$(command -v dkp-pacman || command -v pacman)
          $PM -Sy --noconfirm
          $PM -S --noconfirm switch-sdl2 switch-sdl2_ttf switch-freetype switch-libpng switch-bzip2 switch-zlib

      - name: Build NRO
        run: make

      # EXPERIMENTAL: needs a repo secret PROD_KEYS = base64 of your prod.keys.
      # Skipped (not failed) if the secret is missing or the packer errors out.
      - name: Build NSP (experimental)
        continue-on-error: true
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          if [ -z "$PROD_KEYS" ]; then echo "No PROD_KEYS secret, skipping NSP"; exit 0; fi
          apt-get update && apt-get install -y build-essential git
          git clone --depth 1 https://github.com/The-4n/hacBrewPack.git
          make -C hacBrewPack
          mkdir -p ~/.switch hbp/exefs hbp/control hbp/logo hbp/romfs
          echo "$PROD_KEYS" | base64 -d > ~/.switch/prod.keys
          cp hacBrewPack/hacbrewpack hbp/ 
          elf2nso ilot14_hollow.elf hbp/exefs/main
          cp ilot14_hollow.nacp hbp/control/control.nacp
          cp icon.jpg hbp/control/icon_AmericanEnglish.dat
          if [ -f main.npdm ]; then cp main.npdm hbp/exefs/main.npdm; fi
          cd hbp && ./hacbrewpack --titleid 0100A14000140000 --nopatchnacplogo -k ~/.switch/prod.keys
          mkdir -p ../out_nsp && cp hacbrewpack_nsp/*.nsp ../out_nsp/ilot14_hollow_base.nsp

      - name: Package SD card layout
        run: |
          mkdir -p out/switch/ilot14_hollow/dlc
          cp ilot14_hollow.nro out/switch/ilot14_hollow/
          cp dlc/*.dlc out/switch/ilot14_hollow/dlc/
          [ -d out_nsp ] && cp out_nsp/*.nsp out/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: ilot14-hollow-ashes
          path: out/
